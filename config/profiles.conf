# Daftar tool dan profil. Dibaca oleh setup.sh (Linux/macOS/WSL) dan setup.ps1 (Windows).
# Urutan tool di profil = urutan pemasangan, jadi dependensi harus di depan
# (node sebelum gemini/qwen, docker sebelum n8n).
#
# Format [tools]   : nama = keterangan singkat
# Format [profiles]: nama = daftar tool dipisah spasi
# Implementasi tiap tool ada di tools/unix/<nama>.sh dan tools/windows/<nama>.ps1.

[tools]
base             = Alat dasar: git, curl, unzip, jq, ripgrep, build tools
node             = Node.js LTS lewat fnm (per-user)
bun              = Bun runtime dan package manager
python           = uv + Python 3.12
docker           = Docker Engine/Desktop + Compose (butuh admin)
opencode         = OpenCode CLI (coding agent, ada model gratis)
opencode-desktop = OpenCode Desktop (Windows dan macOS)
claude           = Claude Code CLI
gemini           = Gemini CLI (kuota gratis harian)
qwen             = Qwen Code CLI (model lewat OpenRouter/API key)
n8n              = n8n + PostgreSQL di Docker

[profiles]
minimal = base opencode
coding  = base node bun python opencode opencode-desktop claude gemini qwen
full    = base node bun python docker opencode opencode-desktop claude gemini qwen n8n
