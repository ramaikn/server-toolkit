# n8n + PostgreSQL (+ WAHA opsional). Nilai rahasia dibaca dari file .env di folder yang sama.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - dbdata:/var/lib/postgresql/data
    # n8n baru dijalankan setelah database benar-benar siap
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "${N8N_BIND_ADDRESS:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      # Host database = NAMA LAYANAN ("db"), bukan 127.0.0.1 / localhost
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TZ:-Asia/Makassar}
      TZ: ${TZ:-Asia/Makassar}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Gateway WhatsApp tidak resmi. Hanya jalan jika COMPOSE_PROFILES=waha ada di .env.
  # Dari n8n, panggil dengan alamat http://waha:3000 (nama layanan, bukan localhost).
  waha:
    image: devlikeapro/waha
    profiles: ["waha"]
    ports:
      - "${WAHA_BIND_ADDRESS:-127.0.0.1}:${WAHA_PORT:-3000}:3000"
    environment:
      # NOWEB lebih ringan memori daripada engine berbasis browser
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-}
      WHATSAPP_SWAGGER_USERNAME: admin
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-}
    volumes:
      - waha_sessions:/app/.sessions
    restart: unless-stopped

volumes:
  dbdata:
  n8n_data:
  waha_sessions:
